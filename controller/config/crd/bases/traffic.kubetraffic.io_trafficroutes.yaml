---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: trafficroutes.traffic.kubetraffic.io
spec:
  group: traffic.kubetraffic.io
  names:
    categories:
    - kubetraffic
    kind: TrafficRoute
    listKind: TrafficRouteList
    plural: trafficroutes
    shortNames:
    - tr
    - troute
    singular: trafficroute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TrafficRoute is the Schema for the trafficroutes API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TrafficRouteSpec is the desired L7 routing configuration
              for a single host.
            properties:
              host:
                description: Host is the HTTP authority (Host header / :authority)
                  this route matches.
                maxLength: 253
                minLength: 1
                type: string
              routes:
                description: Routes is the ordered list of path rules for Host. First
                  match wins.
                items:
                  description: RouteRule is one path-based routing rule.
                  properties:
                    backend:
                      description: Backend is the Service this rule sends traffic
                        to.
                      properties:
                        port:
                          description: Port is the Service port number.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        service:
                          description: Service is a Service name in the TrafficRoute's
                            namespace.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - port
                      - service
                      type: object
                    health:
                      description: Health sets the thresholds the decision engine
                        uses to shift traffic.
                      properties:
                        errorRateThreshold:
                          description: |-
                            ErrorRateThreshold is the percent error rate above which traffic to the
                            affected version is reduced.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                        latencyThreshold:
                          description: LatencyThreshold is the p95 latency above which
                            traffic is reduced.
                          type: string
                        minRequests:
                          description: MinRequests is the sample size required before
                            health rules act.
                          format: int32
                          minimum: 0
                          type: integer
                        stabilizationWindow:
                          description: |-
                            StabilizationWindow is the healthy dwell time required before raising
                            canary weight.
                          type: string
                      type: object
                    path:
                      default: /
                      description: Path is the HTTP path prefix to match (e.g. "/payment").
                      pattern: ^/
                      type: string
                    resilience:
                      description: Resilience configures timeouts, retries and the
                        circuit breaker.
                      properties:
                        circuitBreaker:
                          description: CircuitBreakerPolicy configures the CLOSED
                            -> OPEN -> HALF_OPEN state machine.
                          properties:
                            enabled:
                              type: boolean
                            failureThreshold:
                              description: FailureThreshold is the consecutive failure
                                count that opens the circuit.
                              format: int32
                              minimum: 1
                              type: integer
                            halfOpenRequests:
                              description: HalfOpenRequests is the number of trial
                                requests allowed in HALF_OPEN.
                              format: int32
                              minimum: 0
                              type: integer
                            recoveryTimeout:
                              description: RecoveryTimeout is how long the circuit
                                stays OPEN before HALF_OPEN.
                              type: string
                          type: object
                        retries:
                          description: RetryPolicy configures automatic retries.
                          properties:
                            attempts:
                              description: Attempts is the number of retries after
                                the initial request.
                              format: int32
                              maximum: 10
                              minimum: 0
                              type: integer
                            perTryTimeout:
                              description: PerTryTimeout bounds each individual attempt.
                                Defaults to Timeout.
                              type: string
                            retryOn:
                              description: RetryOn lists the conditions that trigger
                                a retry.
                              items:
                                enum:
                                - 5xx
                                - gateway-error
                                - connect-failure
                                - retriable-status-codes
                                - reset
                                type: string
                              type: array
                          required:
                          - attempts
                          type: object
                        timeout:
                          description: Timeout is the overall upstream request timeout.
                          type: string
                      type: object
                    security:
                      description: Security configures rate limiting and JWT authentication.
                      properties:
                        jwt:
                          description: |-
                            JWTPolicy configures JWT authentication. Signing keys are always referenced
                            from a Secret; they are never inlined in the CRD.
                          properties:
                            audiences:
                              description: Audiences is the set of acceptable "aud"
                                claims.
                              items:
                                type: string
                              type: array
                            forwardToken:
                              description: ForwardToken passes the validated token
                                to the upstream. Defaults to true.
                              type: boolean
                            issuer:
                              description: Issuer is the expected "iss" claim.
                              minLength: 1
                              type: string
                            jwksSecretRef:
                              description: |-
                                JWKSSecretRef references a Secret in the TrafficRoute's namespace holding
                                the JSON Web Key Set.
                              properties:
                                key:
                                  default: jwks.json
                                  type: string
                                name:
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              type: object
                          required:
                          - issuer
                          type: object
                        rateLimit:
                          description: RateLimitPolicy configures request rate limiting.
                          properties:
                            algorithm:
                              default: TOKEN_BUCKET
                              description: Algorithm selects the limiter implementation.
                              enum:
                              - FIXED_WINDOW
                              - TOKEN_BUCKET
                              type: string
                            burst:
                              description: Burst is the token-bucket burst allowance.
                                Defaults to RequestsPerSecond.
                              format: int32
                              minimum: 0
                              type: integer
                            requestsPerSecond:
                              description: RequestsPerSecond is the sustained allowed
                                rate.
                              format: int32
                              minimum: 1
                              type: integer
                          required:
                          - requestsPerSecond
                          type: object
                      type: object
                    strategy:
                      description: Strategy selects how traffic is shifted across
                        Versions.
                      properties:
                        blueGreen:
                          description: BlueGreen tunes blue/green cutover (Type=BLUE_GREEN).
                          properties:
                            autoPromote:
                              description: |-
                                AutoPromote flips 100% to the green version once it stays healthy for
                                PromoteAfter. When false, promotion requires an API call.
                              type: boolean
                            promoteAfter:
                              description: PromoteAfter is the healthy dwell time
                                required before auto promotion.
                              type: string
                          type: object
                        canary:
                          description: Canary tunes automatic canary progression (Type=CANARY).
                          properties:
                            maxWeight:
                              description: MaxWeight caps automatic promotion until
                                a manual promote (0-100).
                              format: int32
                              maximum: 100
                              minimum: 0
                              type: integer
                            stepInterval:
                              description: StepInterval is the minimum healthy dwell
                                time before advancing a step.
                              type: string
                            steps:
                              description: |-
                                Steps is the strictly-ascending ladder of canary weight percentages.
                                Defaults to [5,10,20,30,50,100] when empty.
                              items:
                                format: int32
                                type: integer
                              maxItems: 20
                              type: array
                          type: object
                        type:
                          default: WEIGHTED
                          description: StrategyType is the traffic-shifting mode for
                            a RouteRule.
                          enum:
                          - WEIGHTED
                          - CANARY
                          - BLUE_GREEN
                          type: string
                      type: object
                    versions:
                      description: |-
                        Versions splits traffic across labelled subsets of Backend. When set, the
                        weights must sum to 100. When empty, all Backend endpoints are used.
                      items:
                        description: BackendVersion is one weighted subset of a backend
                          Service.
                        properties:
                          labels:
                            additionalProperties:
                              type: string
                            description: Labels overrides the pod selector for this
                              version.
                            type: object
                          name:
                            description: |-
                              Name identifies the version. Unless Labels is set, endpoints are resolved
                              by matching {spec.versionLabel: Name} on the backing pods.
                            maxLength: 63
                            minLength: 1
                            type: string
                          weight:
                            description: Weight is the relative share of traffic for
                              this version (0-100).
                            format: int32
                            maximum: 100
                            minimum: 0
                            type: integer
                        required:
                        - name
                        - weight
                        type: object
                      maxItems: 16
                      type: array
                  required:
                  - backend
                  type: object
                maxItems: 64
                minItems: 1
                type: array
              versionLabel:
                default: app.kubernetes.io/version
                description: |-
                  VersionLabel is the pod label key used to distinguish backend versions
                  when a RouteRule does not set explicit selector labels.
                type: string
            required:
            - host
            - routes
            type: object
          status:
            description: TrafficRouteStatus is the observed state of a TrafficRoute.
            properties:
              conditions:
                description: Conditions follows the standard Kubernetes condition
                  conventions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastDecision:
                description: LastDecision is the most recent traffic decision applied.
                properties:
                  id:
                    type: string
                  newWeight:
                    format: int32
                    type: integer
                  oldWeight:
                    format: int32
                    type: integer
                  reason:
                    type: string
                  time:
                    format: date-time
                    type: string
                  version:
                    type: string
                required:
                - newWeight
                - oldWeight
                type: object
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: TrafficRoutePhase is a coarse lifecycle summary.
                enum:
                - Pending
                - Ready
                - Degraded
                - RollingBack
                - Invalid
                type: string
              routes:
                description: Routes mirrors spec.routes with resolved, live state.
                items:
                  description: RouteStatus is the resolved state of one RouteRule.
                  properties:
                    backend:
                      type: string
                    backendHealth:
                      items:
                        description: VersionHealth is the last observed health for
                          one version.
                        properties:
                          circuitState:
                            enum:
                            - CLOSED
                            - OPEN
                            - HALF_OPEN
                            type: string
                          errorRate:
                            type: string
                          p95Latency:
                            type: string
                          status:
                            enum:
                            - Healthy
                            - Degraded
                            - Unhealthy
                            - Unknown
                            type: string
                          version:
                            type: string
                        required:
                        - status
                        - version
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    currentWeights:
                      items:
                        description: VersionWeight is the effective weight currently
                          programmed for one version.
                        properties:
                          version:
                            type: string
                          weight:
                            format: int32
                            type: integer
                        required:
                        - version
                        - weight
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    path:
                      type: string
                    resolvedEndpoints:
                      items:
                        description: VersionEndpoints reports discovered endpoints
                          for one version.
                        properties:
                          addresses:
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          ready:
                            format: int32
                            type: integer
                          total:
                            format: int32
                            type: integer
                          version:
                            type: string
                        required:
                        - ready
                        - total
                        - version
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - backend
                  - path
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
