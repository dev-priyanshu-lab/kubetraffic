---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-traffic-kubetraffic-io-v1alpha1-trafficroute
  failurePolicy: Fail
  name: vtrafficroute.kb.io
  rules:
  - apiGroups:
    - traffic.kubetraffic.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - trafficroutes
  sideEffects: None
