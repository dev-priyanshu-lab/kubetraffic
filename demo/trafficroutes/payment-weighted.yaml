# Valid: fixed 90/10 weighted split between payment v1 and v2.
apiVersion: traffic.kubetraffic.io/v1alpha1
kind: TrafficRoute
metadata:
  name: payment-weighted
  namespace: demo
spec:
  host: api.example.com
  versionLabel: app.kubernetes.io/version
  routes:
    - path: /payment
      backend:
        service: payment
        port: 8080
      versions:
        - name: v1
          weight: 90
        - name: v2
          weight: 10
      strategy:
        type: WEIGHTED
      resilience:
        timeout: 2s
        retries:
          attempts: 3
          retryOn: ["5xx", "connect-failure"]
        circuitBreaker:
          enabled: true
          failureThreshold: 5
          recoveryTimeout: 30s
          halfOpenRequests: 1
      security:
        rateLimit:
          requestsPerSecond: 100
      health:
        errorRateThreshold: 5
        latencyThreshold: 500ms
        minRequests: 20
