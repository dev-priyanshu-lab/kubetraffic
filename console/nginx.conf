server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Regenerated at container start (see docker-entrypoint.sh) — never cache it.
  location = /config.js {
    add_header Cache-Control "no-store";
    try_files /config.js =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /healthz {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
