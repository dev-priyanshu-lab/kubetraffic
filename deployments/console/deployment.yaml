apiVersion: v1
kind: Service
metadata:
  name: kubetraffic-console
  namespace: kubetraffic-system
  labels:
    app.kubernetes.io/name: kubetraffic
    app.kubernetes.io/component: console
spec:
  selector:
    app.kubernetes.io/name: kubetraffic
    app.kubernetes.io/component: console
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubetraffic-console
  namespace: kubetraffic-system
  labels:
    app.kubernetes.io/name: kubetraffic
    app.kubernetes.io/component: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubetraffic
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubetraffic
        app.kubernetes.io/component: console
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # nginx needs a writable html dir (config.js is (re)generated at startup) and a
      # writable cache/run dir; the rest of the root filesystem stays read-only.
      initContainers:
        - name: seed-html
          image: kubetraffic/console:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -r /usr/share/nginx/html/. /html-out/"]
          volumeMounts:
            - { name: html, mountPath: /html-out }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: console
          image: kubetraffic/console:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # Same-origin by default (""). Point this at the control-plane's REST
            # API if the console isn't served behind a reverse proxy that forwards
            # /api there for you.
            - name: KUBETRAFFIC_API_BASE_URL
              value: ""
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: html, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
