apiVersion: v1
kind: Service
metadata:
  name: kubetraffic-control-plane
  namespace: kubetraffic-system
  labels:
    app.kubernetes.io/name: kubetraffic
    app.kubernetes.io/component: control-plane
spec:
  selector:
    app.kubernetes.io/name: kubetraffic
    app.kubernetes.io/component: control-plane
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: mgmt, port: 8081, targetPort: mgmt }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubetraffic-control-plane
  namespace: kubetraffic-system
  labels:
    app.kubernetes.io/name: kubetraffic
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubetraffic
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubetraffic
        app.kubernetes.io/component: control-plane
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z kubetraffic-postgres.kubetraffic-system.svc 5432; do echo waiting for postgres; sleep 2; done"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kubetraffic
                    app.kubernetes.io/component: control-plane
      containers:
        - name: control-plane
          image: kubetraffic/control-plane:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 8081 }
          env:
            - name: DB_URL
              value: jdbc:postgresql://kubetraffic-postgres.kubetraffic-system.svc:5432/kubetraffic
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: kubetraffic-postgres, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: kubetraffic-postgres, key: password } }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: mgmt }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: mgmt }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: mgmt }
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
