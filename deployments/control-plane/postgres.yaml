# DEV ONLY: in-cluster single PostgreSQL. Production uses an external managed DB.
apiVersion: v1
kind: Secret
metadata:
  name: kubetraffic-postgres
  namespace: kubetraffic-system
type: Opaque
stringData:
  password: kubetraffic-dev
  username: kubetraffic
  database: kubetraffic
---
apiVersion: v1
kind: Service
metadata:
  name: kubetraffic-postgres
  namespace: kubetraffic-system
  labels:
    app.kubernetes.io/name: kubetraffic
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: kubetraffic
    app.kubernetes.io/component: postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubetraffic-postgres
  namespace: kubetraffic-system
  labels:
    app.kubernetes.io/name: kubetraffic
    app.kubernetes.io/component: postgres
spec:
  serviceName: kubetraffic-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubetraffic
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubetraffic
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        # postgres:alpine ships user "postgres" as uid/gid 70. fsGroup makes the
        # PVC group-writable; PGDATA points at a SUBDIR so initdb (with
        # --allow-group-access) creates it 0750 owned by 70:70.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: kubetraffic-postgres, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: kubetraffic-postgres, key: password } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: kubetraffic-postgres, key: database } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--allow-group-access"
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "kubetraffic", "-d", "kubetraffic"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: postgres }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
